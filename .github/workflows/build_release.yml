name: Build Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]        # 打 v* 标签时直接发 Release
  workflow_dispatch:      # 手动触发（发版 / 其他分支）

permissions:
  contents: write         # 发布 Release 需要写权限

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Xmx6g -XX:MaxMetaspaceSize=3g"
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x ./gradlew

      # 版本号从 version.py 单一真源取（与产物一致）
      - name: Read version
        id: ver
        run: |
          set -e
          NAME=$(python3 version.py name)
          CODE=$(python3 version.py code)
          {
            echo "name=$NAME"
            echo "code=$CODE"
            echo "tag=v$NAME"
          } >> "$GITHUB_OUTPUT"
          echo "版本: v$NAME ($CODE)"

      # R8 构建；签名由 gradle signingConfig 完成（仓库内置 signkey.p12，V1+V2+V3）
      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      # 校验签名确实打上了。
      # 注意：AGP 9 在 minSdk >= 33 时会自动跳过 V1/V2、只打 V3（V3 向下兼容 V2 校验），
      # 所以这里只要求「验签通过且有一个签名者」，不强求具体 scheme。
      - name: Verify signature
        run: |
          set -e
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK: $APK"
          "$APKSIGNER" verify --verbose "$APK" | tee verify.txt
          grep -qi '^Verifies$' verify.txt \
            || { echo "::error::APK signature verification failed"; exit 1; }
          grep -qi 'Number of signers: [1-9]' verify.txt \
            || { echo "::error::no signer found"; exit 1; }
          echo "签名校验通过 ✓"
          "$APKSIGNER" verify --print-certs "$APK" | sed -n '1,8p'

      # 重命名成规范产物名：ApkVerTool-v<版本>.apk
      - name: Rename APK
        id: apk
        run: |
          set -e
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          OUT="app/build/outputs/apk/release/ApkVerTool-v${{ steps.ver.outputs.name }}.apk"
          mv "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -la app/build/outputs/apk/release/

      - name: Upload Release APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: app/build/outputs/apk/release/*.apk

      # 发版说明：从 version.py（单一真源）里取当前版本那一条生成，
      # 取不到退回 CHANGELOG.md 对应小节，再取不到退回一句话。三步都不会让构建失败。
      - name: Generate release notes
        run: |
          set -e
          python3 - "${{ steps.ver.outputs.name }}" > release-notes.md <<'PY'
          import importlib.util, io, re, sys

          name = sys.argv[1]
          items, date = [], ""

          try:
              spec = importlib.util.spec_from_file_location("version", "version.py")
              v = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(v)
              for ver, d, it in v.CHANGELOG:
                  if ver == name:
                      items, date = list(it), d
                      break
          except Exception as e:
              sys.stderr.write("version.py 解析失败: %s\n" % e)

          if items:
              print("## ApkVerTool v%s  %s\n" % (name, date))
              for n, t in enumerate(items, 1):
                  print("%d. %s" % (n, t))
          else:
              body = ""
              try:
                  md = io.open("CHANGELOG.md", encoding="utf-8").read()
                  m = re.search(r"^##\s*v?%s\b.*?\n(.*?)(?=^## |\Z)" % re.escape(name), md, re.S | re.M)
                  if m:
                      body = m.group(1).strip()
              except Exception:
                  pass
              print("## ApkVerTool v%s\n" % name)
              print(body if body else "更新内容见仓库根目录 `CHANGELOG.md`。")

          print("\n---\n产物已用仓库内置 `signkey.p12` 签名，可直接安装；引擎（`:core`）与命令行（`:cli`）见仓库源码。")
          PY
          echo "---- release-notes.md ----"
          cat release-notes.md

      # 每次构建都发 Release（gh CLI，无第三方依赖）：
      # push 到 main → 用 version.py 的版本号当 tag（v<版本>）；打 v* 标签 → 用标签名。
      # 同一版本重复构建走「覆盖上传 APK + 刷新说明」，不会报 tag 已存在。
      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.ver.outputs.tag }}"
          APK="${{ steps.apk.outputs.path }}"
          echo "发布 $TAG <- $APK"

          # push 到 main 且这个版本已经发过 → 说明本次没改 version.py，不重复发版（避免每次提交都刷 Release）
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ] \
             && gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::v${{ steps.ver.outputs.name }} 已存在，本次不改版本号 → 跳过发布"
            echo "SKIP_RELEASE=1" >> "$GITHUB_ENV"
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "该 Release 已存在，覆盖上传 APK + 刷新说明"
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" \
              --title "ApkVerTool v${{ steps.ver.outputs.name }}" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" "$APK" \
              --title "ApkVerTool v${{ steps.ver.outputs.name }}" \
              --notes-file release-notes.md \
              --latest
          fi

      # 发版后把产物同步进 dist/、刷新官网与 README，并把改动提交回 main。
      # 两次提交都带 [skip ci]，不会被自己再触发一轮构建；docs/ 的改动会触发 pages.yml 部署。
      - name: Sync dist and site
        if: (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && env.SKIP_RELEASE != '1'
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --quiet origin main || true
          python3 scripts/ci_publish.py \
            --apk "${{ steps.apk.outputs.path }}" \
            --name "${{ steps.ver.outputs.name }}" \
            --code "${{ steps.ver.outputs.code }}"
