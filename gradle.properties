org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 8.13.2 官方只测试到 compileSdk 36；本工程因为 io.github.kyant0:backdrop 要求
# minCompileSdk=37 必须用 37。这只是 "AGP was tested up to compileSdk 36" 的 warning，
# 摁掉它保持构建输出干净（不是错误，也不影响产物）。
android.suppressUnsupportedCompileSdk=37,37.0

kotlin.code.style=official
